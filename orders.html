<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新增訂單｜刀劍亂舞代購管理</title><link rel="stylesheet" href="style.css"></head><body><header><div class="topbar"><div class="brand"><h1>刀劍亂舞 STORE 2026</h1><p>祝裝周邊代購管理系統 v3.4 雙幣統計修正版</p></div><nav><a href="index.html">首頁</a><a href="orders.html">新增／編輯訂單</a><a href="buyers.html">訂購人管理</a><a href="statistics.html">商品統計</a><a href="export.html">匯出資料</a></nav></div></header><main><section class="panel"><h2 id="formTitle">新增訂單</h2><div class="toolbar"><div class="field"><label>訂購人</label><input id="buyer" placeholder="例如：林小姐"></div><div class="field"><label>付款狀態</label><select id="payment"><option>未付款</option><option>已付款</option></select></div><div class="field"><label>到貨狀態</label><select id="delivery"><option>未到貨</option><option>已到貨</option><option>已寄出</option><option>完成</option></select></div></div><div style="margin-top:12px"><label>備註</label><textarea id="note"></textarea></div></section><section class="panel"><div class="toolbar"><div class="field"><label>搜尋角色</label><input id="search" placeholder="輸入角色名稱"></div></div><div class="table-wrap"><table><thead><tr><th>#</th><th>角色</th><th>壓克力小<br><span class="small">¥1,320／NT$290</span></th><th>壓克力中<br><span class="small">¥1,540／NT$340</span></th><th>方形立牌<br><span class="small">¥1,100／NT$245</span></th><th>2L寫真<br><span class="small">¥500／NT$110</span></th><th>雨傘吊飾<br><span class="small">¥880／NT$195</span></th></tr></thead><tbody id="characterBody"></tbody></table></div></section><section class="panel"><h2>隨機徽章｜彈數＋數量</h2><div class="grid grid-2"><div><h3 class="section-title">圓形徽章 <span class="badge">¥550／NT$120</span></h3><div id="cbWaves"></div></div><div><h3 class="section-title">方形徽章 <span class="badge">¥550／NT$120</span></h3><div id="sbWaves"></div></div></div></section><section class="panel no-print"><div class="toolbar"><div class="metric"><div class="label">目前商品數</div><div class="value" id="unitCount">0</div></div><div class="metric"><div class="label">目前金額</div><div class="value" id="grandTotal">¥0／NT$0</div></div><button class="primary" id="saveBtn">儲存訂單</button><button class="secondary" id="clearBtn">清空表單</button></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-init.js"></script><script src="data.js"></script><script src="app.js"></script><script>
let draft={items:[]},editingId=new URLSearchParams(location.search).get("edit");
function k(t,a,p){return t+"|"+a+"|"+p}function imap(){const m={};draft.items.forEach(x=>m[k(x.type,x.target,x.product)]=x.qty);return m}
function setQty(type,target,product,priceJpy,priceTwd,qty){qty=Math.max(0,parseInt(qty||0));const key=k(type,target,product);draft.items=draft.items.filter(x=>k(x.type,x.target,x.product)!==key);if(qty>0)draft.items.push({type,target,product,priceJpy,priceTwd,price:priceTwd,qty});updateTotals()}
function bindQty(){document.querySelectorAll(".qty").forEach(el=>el.oninput=()=>setQty(el.dataset.type,el.dataset.target,el.dataset.product,Number(el.dataset.priceJpy),Number(el.dataset.priceTwd),el.value))}
function renderCharacters(filter=""){const m=imap();characterBody.innerHTML="";CHARACTERS.forEach((name,i)=>{if(filter&&!name.toLowerCase().includes(filter.toLowerCase()))return;const tr=document.createElement("tr");tr.innerHTML=`<td>${String(i+1).padStart(3,"0")}</td><td class="left name">${name}</td>`+Object.values(PRODUCTS).map(p=>`<td><input class="qty" type="number" min="0" value="${m[k("角色指定",name,p.name)]||""}" data-type="角色指定" data-target="${name}" data-product="${p.name}" data-price-jpy="${p.jp}" data-price-twd="${p.twd}"></td>`).join("");characterBody.appendChild(tr)});bindQty()}
function renderWaves(){const m=imap();["cb","sb"].forEach(type=>{document.getElementById(type+"Waves").innerHTML=WAVES.map(w=>`<div class="product-line"><span>第${w}彈 <span class="badge">${w===12?9:10} 種</span></span><input class="qty" type="number" min="0" value="${m[k("隨機商品","第"+w+"彈",RANDOM_PRODUCTS[type].name)]||""}" data-type="隨機商品" data-target="第${w}彈" data-product="${RANDOM_PRODUCTS[type].name}" data-price-jpy="${RANDOM_PRODUCTS[type].jp}" data-price-twd="${RANDOM_PRODUCTS[type].twd}"></div>`).join("")});bindQty()}
function updateTotals(){unitCount.textContent=draft.items.reduce((s,x)=>s+x.qty,0);grandTotal.textContent=dualMoney(draft.items.reduce((s,x)=>s+itemSubtotalJpy(x),0),draft.items.reduce((s,x)=>s+itemSubtotalTwd(x),0));localStorage.setItem(DRAFT_KEY,JSON.stringify({buyer:buyer.value,payment:payment.value,delivery:delivery.value,note:note.value,items:draft.items}))}
async function load(){if(editingId){const o=await getOrder(editingId);if(o){draft={items:o.items||[]};buyer.value=o.buyer;payment.value=o.payment;delivery.value=o.delivery;note.value=o.note||"";formTitle.textContent="編輯訂單"}}else{try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null");if(d){draft={items:d.items||[]};buyer.value=d.buyer||"";payment.value=d.payment||"未付款";delivery.value=d.delivery||"未到貨";note.value=d.note||""}}catch{}}renderCharacters();renderWaves();updateTotals()}
async function save(){if(!buyer.value.trim())return alert("請輸入訂購人");if(!draft.items.length)return alert("請至少登記一項商品");saveBtn.disabled=true;saveBtn.textContent="雲端儲存中…";try{let createdAt=Date.now();if(editingId){const old=await getOrder(editingId);if(old)createdAt=old.createdAt||createdAt}await saveOrder({id:editingId||undefined,buyer:buyer.value.trim(),payment:payment.value,delivery:delivery.value,note:note.value.trim(),items:draft.items,createdAt});localStorage.removeItem(DRAFT_KEY);alert("訂單已儲存到雲端");location.href="buyers.html"}catch(e){alert("儲存失敗："+e.message);saveBtn.disabled=false;saveBtn.textContent="儲存訂單"}}
search.oninput=e=>renderCharacters(e.target.value);saveBtn.onclick=save;clearBtn.onclick=()=>{if(confirm("確定清空目前表單？")){localStorage.removeItem(DRAFT_KEY);location.href="orders.html"}};[buyer,payment,delivery,note].forEach(el=>el.oninput=updateTotals);document.addEventListener("DOMContentLoaded",()=>{let loaded=false;onUserReady(user=>{if(user&&!loaded){loaded=true;load()}})});
</script></body></html>
