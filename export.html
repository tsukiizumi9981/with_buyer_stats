<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>匯出資料｜刀劍亂舞代購管理</title><link rel="stylesheet" href="style.css"></head><body><header><div class="topbar"><div class="brand"><h1>刀劍亂舞 STORE 2026</h1><p>祝裝周邊代購管理系統 v3.2 雲端修正版</p></div><nav><a href="index.html">首頁</a><a href="orders.html">新增／編輯訂單</a><a href="buyers.html">訂購人管理</a><a href="statistics.html">商品統計</a><a href="export.html">匯出資料</a></nav></div></header><main><section class="panel"><h2>匯出資料</h2><p class="notice">CSV 可直接用 Excel、Google 試算表或 Numbers 開啟。</p><div class="actions"><button class="primary" id="buyerCsv">匯出訂購人明細 CSV</button><button class="gold" id="productCsv">匯出商品總表 CSV</button><button class="secondary" id="backupBtn">匯出完整備份 JSON</button><label class="btn secondary">匯入備份 JSON<input id="restoreFile" type="file" accept=".json" style="display:none"></label></div></section><section class="panel"><h2>備份提醒</h2><p class="notice">資料儲存在 Cloud Firestore，可在不同裝置同步。仍建議定期匯出 JSON 作為額外備份。</p></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-init.js"></script><script src="data.js"></script><script src="app.js"></script><script>
buyerCsv.onclick=async()=>{const os=await getOrders(),rows=[["訂購人","付款狀態","到貨狀態","備註","類型","角色／彈數","商品","單價","數量","小計"]];os.forEach(o=>(o.items||[]).forEach(x=>rows.push([o.buyer,o.payment,o.delivery,o.note||"",x.type,x.target,x.product,x.price,x.qty,x.price*x.qty])));downloadCSV("刀劍亂舞_訂購人明細.csv",rows)};
productCsv.onclick=async()=>{const os=await getOrders(),agg={};os.flatMap(o=>o.items||[]).forEach(x=>{const k=[x.type,x.target,x.product,x.price].join("|");agg[k]=(agg[k]||0)+x.qty});const rows=[["類型","角色／彈數","商品","單價","總數量","總金額"]];Object.entries(agg).forEach(([k,q])=>{const [t,target,p,price]=k.split("|");rows.push([t,target,p,price,q,Number(price)*q])});downloadCSV("刀劍亂舞_商品總表.csv",rows)};
backupBtn.onclick=async()=>{const os=await getOrders(),blob=new Blob([JSON.stringify(os,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="刀劍亂舞_完整備份.json";a.click();URL.revokeObjectURL(a.href)};
restoreFile.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw 0;if(confirm("匯入後會覆蓋雲端目前資料，確定繼續？")){await replaceAllOrders(data);alert("備份已匯入 Firestore")}}catch(err){console.error(err);alert("備份檔格式不正確或匯入失敗")}};r.readAsText(f)};
</script></body></html>
