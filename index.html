<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首頁｜刀劍亂舞代購管理</title><link rel="stylesheet" href="style.css"></head><body><header><div class="topbar"><div class="brand"><h1>刀劍亂舞 STORE 2026</h1><p>匯率換算約0.22。祝裝周邊代購管理系統 v3.5 雙幣互動修正版</p></div><nav><a href="index.html">首頁</a><a href="orders.html">新增／編輯訂單</a><a href="buyers.html">訂購人管理</a><a href="statistics.html">商品統計</a><a href="export.html">匯出資料</a></nav></div></header><main><div class="grid grid-4"><div class="card metric"><div class="label">訂購人數</div><div class="value" id="buyers">0</div></div><div class="card metric"><div class="label">訂單數</div><div class="value" id="orders">0</div></div><div class="card metric"><div class="label">商品總數</div><div class="value" id="units">0</div></div><div class="card metric"><div class="label">總金額</div><div class="value" id="total">¥0／NT$0</div></div></div><div class="grid grid-2" style="margin-top:16px"><section class="panel"><h2>快捷功能</h2><div class="actions"><a class="btn primary" href="orders.html">＋ 新增訂單</a><a class="btn secondary" href="buyers.html">查看訂購人</a><a class="btn gold" href="statistics.html">查看商品統計</a></div></section><section class="panel"><h2>付款概況</h2><div id="paymentSummary" class="notice"></div></section></div><section class="panel"><h2>最近新增訂單</h2><div id="recent"></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-init.js?v=3.5"></script><script src="data.js?v=3.5"></script><script src="app.js?v=3.5"></script><script>
function renderDashboard(os){
 const list=Array.isArray(os)?os:[];
 document.getElementById("buyers").textContent=new Set(list.map(o=>o.buyer)).size;
 document.getElementById("orders").textContent=list.length;
 document.getElementById("units").textContent=list.reduce((s,o)=>s+orderUnits(o),0);
 document.getElementById("total").textContent=dualMoney(list.reduce((s,o)=>s+orderTotalJpy(o),0),list.reduce((s,o)=>s+orderTotalTwd(o),0));
 const paid=list.filter(o=>o.payment==="已付款").length;
 document.getElementById("paymentSummary").innerHTML=`已付款：<b>${paid}</b> 筆<br>未付款：<b>${list.length-paid}</b> 筆`;
 const recent=list.slice(0,6);
 document.getElementById("recent").innerHTML=recent.length?recent.map(o=>`<div class="product-line"><span><b>${esc(o.buyer)}</b> <span class="muted">${o.updatedAt||o.createdAt?new Date(o.updatedAt||o.createdAt).toLocaleString():"無時間資料"}</span></span><span>${orderUnits(o)} 件・<b>${dualMoney(orderTotalJpy(o),orderTotalTwd(o))}</b></span></div>`).join(""):`<div class="empty">尚無訂單</div>`;
}
document.addEventListener("DOMContentLoaded",()=>{let stop=()=>{};onUserReady(user=>{stop();if(!user){renderDashboard([]);return;}stop=listenOrders(renderDashboard,e=>alert("Firestore 讀取失敗："+e.message))})});
</script></body></html>
