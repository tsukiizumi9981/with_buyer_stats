<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首頁｜刀劍亂舞代購管理</title><link rel="stylesheet" href="style.css"></head><body><header><div class="topbar"><div class="brand"><h1>刀劍亂舞 STORE 2026</h1><p>祝裝周邊代購管理系統 v3 雲端版</p></div><nav><a href="index.html">首頁</a><a href="orders.html">新增／編輯訂單</a><a href="buyers.html">訂購人管理</a><a href="statistics.html">商品統計</a><a href="export.html">匯出資料</a></nav></div></header><main><div class="grid grid-4"><div class="card metric"><div class="label">訂購人數</div><div class="value" id="buyers">0</div></div><div class="card metric"><div class="label">訂單數</div><div class="value" id="orders">0</div></div><div class="card metric"><div class="label">商品總數</div><div class="value" id="units">0</div></div><div class="card metric"><div class="label">總金額</div><div class="value" id="total">NT$0</div></div></div><div class="grid grid-2" style="margin-top:16px"><section class="panel"><h2>快捷功能</h2><div class="actions"><a class="btn primary" href="orders.html">＋ 新增訂單</a><a class="btn secondary" href="buyers.html">查看訂購人</a><a class="btn gold" href="statistics.html">查看商品統計</a></div></section><section class="panel"><h2>付款概況</h2><div id="paymentSummary" class="notice"></div></section></div><section class="panel"><h2>最近新增訂單</h2><div id="recent"></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-init.js"></script><script src="data.js"></script><script src="app.js"></script><script>
fbAuth.onAuthStateChanged(user=>{if(!user)return;listenOrders(os=>{buyers.textContent=new Set(os.map(o=>o.buyer)).size;orders.textContent=os.length;units.textContent=os.reduce((s,o)=>s+orderUnits(o),0);total.textContent=money(os.reduce((s,o)=>s+orderTotal(o),0));const paid=os.filter(o=>o.payment==="已付款").length;paymentSummary.innerHTML=`已付款：<b>${paid}</b> 筆<br>未付款：<b>${os.length-paid}</b> 筆`;const r=os.slice(0,6);recent.innerHTML=r.length?r.map(o=>`<div class="product-line"><span><b>${esc(o.buyer)}</b> <span class="muted">${new Date(o.updatedAt).toLocaleString()}</span></span><span>${orderUnits(o)} 件・<b>${money(orderTotal(o))}</b></span></div>`).join(""):`<div class="empty">尚無訂單</div>`})});
</script></body></html>
