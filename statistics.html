<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品統計｜刀劍亂舞代購管理</title><link rel="stylesheet" href="style.css"></head><body><header><div class="topbar"><div class="brand"><h1>刀劍亂舞 STORE 2026</h1><p>祝裝周邊代購管理系統 v2</p></div><nav><a href="index.html">首頁</a><a href="orders.html">新增／編輯訂單</a><a href="buyers.html">訂購人管理</a><a href="statistics.html">商品統計</a><a href="export.html">匯出資料</a></nav></div></header><main><div class="grid grid-4"><div class="card metric"><div class="label">角色商品件數</div><div class="value" id="charUnits">0</div></div><div class="card metric"><div class="label">隨機徽章件數</div><div class="value" id="randomUnits">0</div></div><div class="card metric"><div class="label">總商品數</div><div class="value" id="allUnits">0</div></div><div class="card metric"><div class="label">總金額</div><div class="value" id="allTotal">NT$0</div></div></div><section class="panel" style="margin-top:16px"><h2>角色指定商品總統計</h2><div id="characterStats"></div></section><section class="panel"><h2>隨機徽章總統計</h2><div class="grid grid-2"><div><h3 class="section-title">圓形徽章</h3><div id="cbStats"></div></div><div><h3 class="section-title">方形徽章</h3><div id="sbStats"></div></div></div></section></main><script src="data.js"></script><script src="app.js"></script><script>const os=getOrders(),all=os.flatMap(o=>o.items);charUnits.textContent=all.filter(x=>x.type==="角色指定").reduce((s,x)=>s+x.qty,0);randomUnits.textContent=all.filter(x=>x.type==="隨機商品").reduce((s,x)=>s+x.qty,0);allUnits.textContent=all.reduce((s,x)=>s+x.qty,0);allTotal.textContent=money(all.reduce((s,x)=>s+x.price*x.qty,0));const agg={};all.filter(x=>x.type==="角色指定").forEach(x=>{const k=x.product+"|"+x.target;agg[k]=(agg[k]||0)+x.qty});characterStats.innerHTML=Object.values(PRODUCTS).map(p=>{const rows=Object.entries(agg).filter(([k])=>k.startsWith(p.name+"|")).map(([k,v])=>[k.split("|")[1],v]).sort((a,b)=>b[1]-a[1]);return `<div style="margin-bottom:18px"><h3 class="section-title">${p.name} <span class="badge">${rows.reduce((s,r)=>s+r[1],0)} 件</span></h3>${rows.length?rows.map(r=>`<div class="product-line"><span>${r[0]}</span><b>${r[1]}</b></div>`).join(""):'<div class="muted">尚無資料</div>'}</div>`}).join("");function rr(type,id){const name=RANDOM_PRODUCTS[type].name,data={};all.filter(x=>x.product===name).forEach(x=>data[x.target]=(data[x.target]||0)+x.qty);document.getElementById(id).innerHTML=WAVES.map(w=>`<div class="product-line"><span>第${w}彈</span><b>${data["第"+w+"彈"]||0} 抽</b></div>`).join("")}rr("cb","cbStats");rr("sb","sbStats");</script></body></html>
