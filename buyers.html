<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>訂購人管理｜刀劍亂舞代購管理</title><link rel="stylesheet" href="style.css"></head><body><header><div class="topbar"><div class="brand"><h1>刀劍亂舞 STORE 2026</h1><p>祝裝周邊代購管理系統 v2</p></div><nav><a href="index.html">首頁</a><a href="orders.html">新增／編輯訂單</a><a href="buyers.html">訂購人管理</a><a href="statistics.html">商品統計</a><a href="export.html">匯出資料</a></nav></div></header><main><section class="panel"><div class="toolbar"><div class="field"><label>搜尋訂購人</label><input id="search"></div><div class="field"><label>付款篩選</label><select id="paymentFilter"><option value="">全部</option><option>未付款</option><option>已付款</option></select></div><div class="field"><label>到貨篩選</label><select id="deliveryFilter"><option value="">全部</option><option>未到貨</option><option>已到貨</option><option>已寄出</option><option>完成</option></select></div></div></section><section id="ordersList"></section></main><script src="data.js"></script><script src="app.js"></script><script>function groupItems(items){const chars={},random=[];items.forEach(x=>{if(x.type==="角色指定"){(chars[x.target]??=[]).push(x)}else random.push(x)});return {chars,random}}function render(){let os=getOrders().sort((a,b)=>b.updatedAt-a.updatedAt);const q=search.value.trim().toLowerCase(),pf=paymentFilter.value,df=deliveryFilter.value;os=os.filter(o=>(!q||o.buyer.toLowerCase().includes(q))&&(!pf||o.payment===pf)&&(!df||o.delivery===df));ordersList.innerHTML=os.length?os.map(o=>{const g=groupItems(o.items);const ch=Object.entries(g.chars).map(([name,items])=>`<div style="margin-bottom:10px"><b>${name}</b>${items.map(x=>`<div class="product-line"><span>${x.product}</span><span>×${x.qty}・${money(x.price*x.qty)}</span></div>`).join("")}</div>`).join("");const rd=g.random.map(x=>`<div class="product-line"><span>${x.product}｜${x.target}</span><span>×${x.qty}・${money(x.price*x.qty)}</span></div>`).join("");return `<article class="order-card collapsed" id="card-${o.id}"><div class="order-head" onclick="document.getElementById('card-${o.id}').classList.toggle('collapsed')"><div><span class="name">${esc(o.buyer)}</span> <span class="${o.payment==="已付款"?"status-paid":"status-unpaid"}">${o.payment}</span> <span class="badge">${o.delivery}</span></div><div>${orderUnits(o)} 件・<span class="money">${money(orderTotal(o))}</span>　▾</div></div><div class="order-body"><div class="order-groups"><div><h3 class="section-title">角色商品</h3>${ch||'<div class="muted">無</div>'}</div><div><h3 class="section-title">隨機商品</h3>${rd||'<div class="muted">無</div>'}</div></div>${o.note?`<p><b>備註：</b>${esc(o.note)}</p>`:""}<div class="actions no-print"><a class="btn secondary" href="orders.html?edit=${o.id}">修改</a><button class="secondary" onclick="copyOrder('${o.id}')">複製</button><button class="danger" onclick="delOrder('${o.id}')">刪除</button></div></div></article>`}).join(""):`<div class="panel empty">沒有符合條件的訂單</div>`}function delOrder(id){if(!confirm("確定刪除此訂單？"))return;saveOrders(getOrders().filter(o=>o.id!==id));render()}function copyOrder(id){const os=getOrders(),o=os.find(x=>x.id===id);if(!o)return;os.push({...o,id:uid(),buyer:o.buyer+"（複製）",createdAt:Date.now(),updatedAt:Date.now()});saveOrders(os);render()}[search,paymentFilter,deliveryFilter].forEach(el=>el.oninput=render);render();</script></body></html>
