<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>訂購人管理｜刀劍亂舞代購管理</title><link rel="stylesheet" href="style.css"></head><body><header><div class="topbar"><div class="brand"><h1>刀劍亂舞 STORE 2026</h1><p>祝裝周邊代購管理系統 v3.4 雙幣統計修正版</p></div><nav><a href="index.html">首頁</a><a href="orders.html">新增／編輯訂單</a><a href="buyers.html">訂購人管理</a><a href="statistics.html">商品統計</a><a href="export.html">匯出資料</a></nav></div></header><main><section class="panel"><div class="toolbar"><div class="field"><label>搜尋訂購人</label><input id="search"></div><div class="field"><label>付款篩選</label><select id="paymentFilter"><option value="">全部</option><option>未付款</option><option>已付款</option></select></div><div class="field"><label>到貨篩選</label><select id="deliveryFilter"><option value="">全部</option><option>未到貨</option><option>已到貨</option><option>已寄出</option><option>完成</option></select></div></div></section><section id="ordersList"></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-init.js"></script><script src="data.js"></script><script src="app.js"></script><script>
let cloudOrders=[];
function groupItems(items){const chars={},random=[];(items||[]).forEach(x=>{if(x.type==="角色指定"){(chars[x.target]??=[]).push(x)}else random.push(x)});return {chars,random}}
function render(){let os=[...cloudOrders].sort((a,b)=>b.updatedAt-a.updatedAt);const q=search.value.trim().toLowerCase(),pf=paymentFilter.value,df=deliveryFilter.value;os=os.filter(o=>(!q||o.buyer.toLowerCase().includes(q))&&(!pf||o.payment===pf)&&(!df||o.delivery===df));ordersList.innerHTML=os.length?os.map(o=>{const g=groupItems(o.items);const ch=Object.entries(g.chars).map(([name,items])=>`<div style="margin-bottom:10px"><b>${name}</b>${items.map(x=>`<div class="product-line"><span>${x.product}</span><span>×${x.qty}・${dualMoney(itemSubtotalJpy(x),itemSubtotalTwd(x))}</span></div>`).join("")}</div>`).join("");const rd=g.random.map(x=>`<div class="product-line"><span>${x.product}｜${x.target}</span><span>×${x.qty}・${dualMoney(itemSubtotalJpy(x),itemSubtotalTwd(x))}</span></div>`).join("");return `<article class="order-card collapsed" id="card-${o.id}"><div class="order-head" onclick="document.getElementById('card-${o.id}').classList.toggle('collapsed')"><div><span class="name">${esc(o.buyer)}</span> <span class="${o.payment==="已付款"?"status-paid":"status-unpaid"}">${o.payment}</span> <span class="badge">${o.delivery}</span></div><div>${orderUnits(o)} 件・<span class="money">${dualMoney(orderTotalJpy(o),orderTotalTwd(o))}</span>　▾</div></div><div class="order-body"><div class="order-groups"><div><h3 class="section-title">角色商品</h3>${ch||'<div class="muted">無</div>'}</div><div><h3 class="section-title">隨機商品</h3>${rd||'<div class="muted">無</div>'}</div></div>${o.note?`<p><b>備註：</b>${esc(o.note)}</p>`:""}<div class="actions no-print"><a class="btn secondary" href="orders.html?edit=${o.id}">修改</a><button class="secondary" onclick="copyOrder('${o.id}')">複製</button><button class="danger" onclick="delOrder('${o.id}')">刪除</button></div></div></article>`}).join(""):`<div class="panel empty">沒有符合條件的訂單</div>`}
async function delOrder(id){if(!confirm("確定刪除此訂單？"))return;try{await deleteOrder(id)}catch(e){alert("刪除失敗："+e.message)}}
async function copyOrder(id){const o=cloudOrders.find(x=>x.id===id);if(!o)return;try{const c={...o};delete c.id;c.buyer=o.buyer+"（複製）";c.createdAt=Date.now();await saveOrder(c)}catch(e){alert("複製失敗："+e.message)}}
[search,paymentFilter,deliveryFilter].forEach(el=>el.oninput=render);document.addEventListener("DOMContentLoaded",()=>{let stop=()=>{};onUserReady(user=>{stop();if(!user){cloudOrders=[];render();return;}stop=listenOrders(os=>{cloudOrders=os;render()},e=>alert("Firestore 讀取失敗："+e.message))})});
</script></body></html>
