<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>訂購人管理｜刀劍亂舞代購管理</title><link rel="stylesheet" href="style.css"></head><body><header><div class="topbar"><div class="brand"><h1>刀劍亂舞 STORE 2026</h1><p>匯率換算約0.22。祝裝周邊代購管理系統 v3.5 雙幣互動修正版</p></div><nav><a href="index.html">首頁</a><a href="orders.html">新增／編輯訂單</a><a href="buyers.html">訂購人管理</a><a href="statistics.html">商品統計</a><a href="export.html">匯出資料</a></nav></div></header><main><section class="panel"><div class="toolbar"><div class="field"><label>搜尋訂購人</label><input id="search"></div><div class="field"><label>付款篩選</label><select id="paymentFilter"><option value="">全部</option><option>未付款</option><option>已付款</option></select></div><div class="field"><label>到貨篩選</label><select id="deliveryFilter"><option value="">全部</option><option>未到貨</option><option>已到貨</option><option>已寄出</option><option>完成</option></select></div></div></section><section id="ordersList"></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="firebase-init.js?v=3.5"></script><script src="data.js?v=3.5"></script><script src="app.js?v=3.5"></script><script>
let cloudOrders=[];
const $=id=>document.getElementById(id);
function groupItems(items){const chars={},random=[];(items||[]).forEach(x=>{if(x.type==="角色指定"){(chars[x.target]??=[]).push(x)}else random.push(x)});return {chars,random}}
function render(){
 const searchEl=$("search"),paymentEl=$("paymentFilter"),deliveryEl=$("deliveryFilter"),listEl=$("ordersList");
 if(!listEl)return;
 let os=[...cloudOrders].sort((a,b)=>Number(b.updatedAt||b.createdAt||0)-Number(a.updatedAt||a.createdAt||0));
 const q=(searchEl?.value||"").trim().toLowerCase(),pf=paymentEl?.value||"",df=deliveryEl?.value||"";
 os=os.filter(o=>(!q||String(o.buyer||"").toLowerCase().includes(q))&&(!pf||o.payment===pf)&&(!df||o.delivery===df));
 listEl.innerHTML=os.length?os.map(o=>{const g=groupItems(o.items);const ch=Object.entries(g.chars).map(([name,items])=>`<div style="margin-bottom:10px"><b>${esc(name)}</b>${items.map(x=>`<div class="product-line"><span>${esc(x.product)}</span><span>×${itemQty(x)}・${dualMoney(itemSubtotalJpy(x),itemSubtotalTwd(x))}</span></div>`).join("")}</div>`).join("");const rd=g.random.map(x=>`<div class="product-line"><span>${esc(x.product)}｜${esc(x.target)}</span><span>×${itemQty(x)}・${dualMoney(itemSubtotalJpy(x),itemSubtotalTwd(x))}</span></div>`).join("");return `<article class="order-card collapsed" id="card-${o.id}"><div class="order-head" data-card="${o.id}"><div><span class="name">${esc(o.buyer||"未命名")}</span> <span class="${o.payment==="已付款"?"status-paid":"status-unpaid"}">${esc(o.payment||"未付款")}</span> <span class="badge">${esc(o.delivery||"未到貨")}</span></div><div>${orderUnits(o)} 件・<span class="money">${dualMoney(orderTotalJpy(o),orderTotalTwd(o))}</span>　▾</div></div><div class="order-body"><div class="order-groups"><div><h3 class="section-title">角色商品</h3>${ch||'<div class="muted">無</div>'}</div><div><h3 class="section-title">隨機商品</h3>${rd||'<div class="muted">無</div>'}</div></div>${o.note?`<p><b>備註：</b>${esc(o.note)}</p>`:""}<div class="actions no-print"><a class="btn secondary" href="orders.html?edit=${encodeURIComponent(o.id)}">修改</a><button class="secondary copy-btn" data-id="${o.id}">複製</button><button class="danger delete-btn" data-id="${o.id}">刪除</button></div></div></article>`}).join(""):`<div class="panel empty">${CURRENT_USER?"沒有符合條件的訂單":"請先在上方按 Google 登入"}</div>`;
 listEl.querySelectorAll('.order-head').forEach(el=>el.addEventListener('click',()=>$("card-"+el.dataset.card)?.classList.toggle('collapsed')));
 listEl.querySelectorAll('.copy-btn').forEach(el=>el.addEventListener('click',()=>copyOrder(el.dataset.id)));
 listEl.querySelectorAll('.delete-btn').forEach(el=>el.addEventListener('click',()=>delOrder(el.dataset.id)));
}
async function delOrder(id){if(!confirm("確定刪除此訂單？"))return;try{await deleteOrder(id)}catch(e){alert("刪除失敗："+e.message)}}
async function copyOrder(id){const o=cloudOrders.find(x=>x.id===id);if(!o)return;try{const c={...o};delete c.id;c.buyer=(o.buyer||"")+"（複製）";c.createdAt=Date.now();await saveOrder(c)}catch(e){alert("複製失敗："+e.message)}}
document.addEventListener("DOMContentLoaded",()=>{
 [$("search"),$("paymentFilter"),$("deliveryFilter")].filter(Boolean).forEach(el=>el.addEventListener('input',render));
 let stop=()=>{};
 onUserReady(user=>{stop();if(!user){cloudOrders=[];render();return;}stop=listenOrders(os=>{cloudOrders=os;render()},e=>{$("ordersList").innerHTML=`<div class="panel empty">Firestore 讀取失敗：${esc(e.message)}</div>`})});
});
</script></body></html>
